# Activate with: SPRING_PROFILES_ACTIVE=prod
# Set these env vars on Render/Railway (from your Supabase/Neon connection string)

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# Hosting platforms inject PORT
server.port=${PORT:8080}

# JWT — set JWT_SECRET (>=32 chars) in the hosting dashboard
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
