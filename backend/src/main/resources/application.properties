spring.application.name=family-tree-app

# Default profile = local dev with in-memory H2 (zero setup)
spring.datasource.url=jdbc:h2:mem:familytree;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:familytree)
spring.h2.console.enabled=true

server.port=8080

# JWT — override these via env vars in production. Secret must be >= 32 chars.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32chars-minimum!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
